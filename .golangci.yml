version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose     # respuestas HTTP sin cerrar
    - contextcheck  # context.Context que no se propaga
    - errorlint     # errores comparados sin errors.Is/As
    - gosec         # problemas de seguridad
    - noctx         # peticiones HTTP sin context
    - revive        # estilo idiomático
    - rowserrcheck  # filas de BD sin revisar Err()
  exclusions:
    generated: strict
    presets:
      - comments
      - std-error-handling
    paths:
      - internal/httpapi/gen
      - internal/store/db

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - internal/httpapi/gen
      - internal/store/db
